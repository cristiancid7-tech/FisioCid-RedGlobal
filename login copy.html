<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCid - Acceso Profesional</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="flex-center">
        <div class="card">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 0.5rem;">FISIOCID</h2>
            <p style="text-align: center; font-size: 0.8rem; color: var(--secondary); margin-bottom: 1.5rem;">
                SISTEMA DE GESTIÓN CLÍNICA
            </p>

            <div style="display: flex; background: rgba(7, 21, 56, 0.4); padding: 4px; border-radius: 10px; margin-bottom: 1.5rem; border: 1px solid rgba(255, 243, 243, 0.1);">
                <button type="button" id="tabDoctor" onclick="switchLoginTab('DOCTOR')" style="flex: 1; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-user-md"></i> Especialista
                </button>
                <button type="button" id="tabPaciente" onclick="switchLoginTab('PACIENTE')" style="flex: 1; background: transparent; color: var(--secondary); border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-user-injured"></i> Paciente
                </button>
            </div>

            <form id="loginFormDoctor" onsubmit="procesarLoginDoctor(event)">
                <div class="form-group">
                    <label>CORREO PROFESIONAL</label>
                    <input type="email" id="docEmail" placeholder="medico@fisiocid.com" required>
                </div>
                <div class="form-group">
                    <label>CONTRASEÑA CLÍNICA</label>
                    <input type="password" id="docPass" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrarDoc" style="background: var(--primary);">ENTRAR AL SISTEMA</button>
            </form>

            <form id="loginFormPaciente" onsubmit="procesarLoginPaciente(event)" style="display: none;">
                <div class="form-group">
                    <label>CORREO DE ACCESO</label>
                    <input type="email" id="pacEmail" placeholder="paciente@correo.com" required style="text-transform: lowercase;">
                </div>
                <div class="form-group">
                    <label>CONTRASEÑA TEMPORAL</label>
                    <input type="password" id="pacPass" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrarPac" style="background: #ecc94b; color: #1a202c;">INGRESAR AL PORTAL</button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <a href="#" id="olvidePass" style="font-size: 0.8rem; color: var(--secondary); text-decoration: none; font-weight: 500;">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

        </div>
    </div>

    <div id="modalSede" class="modal-overlay" style="display:none;">
        <div class="modal-content card">
            <h3 style="color: var(--primary); text-align: center;">¡Bienvenido a FisioCid!</h3>
            <p style="text-align: center; color: #64748b;">Selecciona la sede donde trabajarás en esta sesión:</p>
            
            <div id="listaSedes" class="form-group" style="margin-top: 20px;"></div>

            <button id="btnConfirmarSede" style="margin-top: 15px; width: 100%;">
                COMENZAR JORNADA
            </button>
        </div>
    </div>
<footer style="width: 100%; text-align: center; padding: 25px 15px 15px 15px; margin-top: 40px; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <hr style="border: 0; border-top: 1px solid #e2e8f0; max-width: 300px; margin: 0 auto 15px auto; opacity: 0.7;">
    
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <span style="font-size: 0.75rem; color: #64748b; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;">
            <span style="color: var(--color-camaleon, #00cfd5); font-weight: 800;">FisioCid</span> Red Global © 2026
        </span>
        <small style="font-size: 0.65rem; color: #94a3b8; letter-spacing: 0.3px; max-width: 400px; line-height: 1.3;">
            Infraestructura digital blindada para interoperabilidad clínica.
        </small>
    </div>
</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    
    <script src="js/supabase-config.js"></script>
    
    <script src="js/auth.js"></script>
    
    <script src="js/login-ui.js"></script>
</body>
</html>
