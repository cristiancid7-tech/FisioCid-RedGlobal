<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - FISIOCID</title>
    <link rel="stylesheet" href="estilos.css">
    
</head>

<body>
      </div>

           <button id="btnCerrarSesion"

    style="background:#fff1f2; color:#be123c; border:none; padding:5px 12px; border-radius:8px; cursor:pointer; font-size: 0.75rem; margin-left: auto; font-weight: bold; width: auto;">

    Cerrar Sesión 🚪

</button>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2 style="margin: 0; color: var(--primary);">FISIOCID</h2>
                <small id="saludoFisio" style="color: var(--secondary); font-weight: bold; text-transform: uppercase;"></small>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="location.href='nuevo-paciente.html'"
                        style="background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: auto;">
                    + NUEVO PACIENTE
                </button>
               <button onclick="location.href='dashboard.html'" class="btn-header" style="background: #f1f5f9; color: #64748b;">
        ⬅️ VOLVER
    </button>
            </div>
        </header>

        <div class="card" style="border-top: 4px solid var(--primary);">
            <h3 style="margin-top: 0; color: var(--primary);">LISTADO MAESTRO</h3>
            
            <input type="text" id="buscador" placeholder="🔍 BUSCAR POR NOMBRE O CURP..." 
                   style="margin-bottom: 1.5rem; width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 8px; box-sizing: border-box; outline: none;">
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #eee;">
                    <thead>
                        <tr style="background: var(--primary); color: white;">
                            <th style="padding: 15px; text-align: left;">NOMBRE DEL PACIENTE</th>
                            <th style="padding: 15px; text-align: center;">EDAD</th>
                            <th style="padding: 15px; text-align: right;">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPacientes">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
   
   
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/lista.js"></script>
    <script src="js/utils.js"></script>
 
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const colorClinica = localStorage.getItem('clinica_color') || '#2563eb'; // Azul por defecto si no hay color guardado
            document.documentElement.style.setProperty('--primary', colorClinica);
        });
    </script>

</body>
</html>
