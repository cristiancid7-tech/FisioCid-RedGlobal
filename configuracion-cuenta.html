<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCid - Seguridad y Cuenta</title>
    <style>
        :root { --primary-color: #10B981; --dark-blue: #1E293B; --bg-gray: #F8FAFC; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-gray); color: var(--dark-blue); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 25px; color: var(--dark-blue); }
        .section-card { border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; margin-bottom: 20px; background: #FFFFFF; }
        .section-title { font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; display: inline-block; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        input { padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 1rem; }
        input:disabled { background-color: #F1F5F9; color: #64748B; }
        .btn { background-color: var(--dark-blue); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        .btn:hover { background-color: #0F172A; }
        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: #059669; }
        .row-code { display: flex; gap: 10px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ CONFIGURACIÓN DE SEGURIDAD</h2>

    <div class="section-card">
        <span class="section-title">Datos de Contacto</span>
        <form id="formDatosContacto">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="confNombre" required>
            </div>
            <div class="form-group">
                <label>Teléfono de Contacto (Público)</label>
                <input type="tel" id="confTelefono" maxlength="10" pattern="[0-9]{10}" required>
            </div>
            <button type="submit" class="btn btn-primary">ACTUALIZAR PERFIL</button>
        </form>
    </div>

    <div class="section-card">
        <span class="section-title">Acceso al Sistema</span>
        <form id="formCredenciales">
            <div class="form-group">
                <label>Nuevo Correo Electrónico</label>
                <input type="email" id="confEmail" placeholder="Nuevo correo de acceso">
            </div>
            <div class="form-group">
                <label>Nueva Contraseña (Mín. 6 caracteres)</label>
                <input type="password" id="confPass" placeholder="••••••••">
            </div>
            <button type="submit" class="btn">ACTUALIZAR CREDENCIALES</button>
        </form>
    </div>

    <div class="section-card">
        <span class="section-title">🔒 Verificación de Respaldo (SMS)</span>
        <p style="font-size: 0.85rem; color: #64748B; margin-top: 0;">Vincula tu teléfono de forma nativa para recuperar tu acceso si pierdes el correo.</p>
        
        <div class="form-group">
            <label>Número de Respaldo (10 dígitos)</label>
            <input type="tel" id="smsTelefono" maxlength="10" pattern="[0-9]{10}" placeholder="Ej. 2381234567">
            <button type="button" id="btnEnviarSMS" class="btn">ENVIAR CÓDIGO SMS</button>
        </div>

        <div id="bloqueVerificacion" class="form-group hidden">
            <label style="color: var(--primary-color);">Ingresa el código de 6 dígitos</label>
            <div class="row-code">
                <input type="text" id="smsToken" maxlength="6" placeholder="123456" style="flex: 1; text-align: center; letter-spacing: 5px; font-weight: bold;">
                <button type="button" id="btnVerificarCodigo" class="btn btn-primary" style="margin-top: 0;">VERIFICAR</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="supabase-config.js"></script>

<script src="configuracion-cuenta.js"></script>
</body>
</html>
