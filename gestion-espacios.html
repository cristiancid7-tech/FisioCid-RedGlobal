<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCid - Gestión de Espacios e Infraestructura</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <style>
        :root {
            --primary: #0ea5e9;
            --soft-bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--soft-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-pagina {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .btn-volver {
            background: #f1f5f9;
            color: #334155;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-volver:hover {
            background: #e2e8f0;
        }

        .layout-gestion {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        .card-panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .btn-guardar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-guardar:hover {
            filter: brightness(0.9);
        }

        .grid-espacios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .espacio-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            position: relative;
            transition: all 0.2s;
        }

        .espacio-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .badge-tipo {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header-pagina">
        <div>
            <h2 style="margin: 0; color: #0f172a; font-size: 1.4rem;">🏛️ Planta y Espacios del Hospital</h2>
            <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.85rem;">Configuración de áreas, camillas, quirófanos y camas de piso</p>
        </div>
        <a href="index.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Volver al Dashboard
        </a>
    </div>

    <div class="layout-gestion">
        <!-- FORMULARIO DE ALTA -->
        <div class="card-panel">
            <h3 style="margin-top: 0; color: #0f172a; font-size: 1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">
                ➕ Registrar Nuevo Espacio
            </h3>

           <form id="formNuevoEspacio">
    <!-- 1. UBICACIÓN / ÁREA -->
    <div class="form-group">
        <label>Ubicación / Área / Piso</label>
        <select id="pisoAreaSelect" required style="margin-bottom: 12px;">
            <option value="PISO 1">🏢 Piso 1</option>
            <option value="PISO 2">🏢 Piso 2</option>
            <option value="PISO 3">🏢 Piso 3</option>
            <option value="PLANTA BAJA">🏛️ Planta Baja</option>
            <option value="URGENCIAS">🚨 Urgencias</option>
            <option value="FISIOTERAPIA">🏥 Área de Fisioterapia</option>
            <option value="QUIROFANO">😷 Área de Quirófanos</option>
        </select>
    </div>

    <!-- 2. IDENTIFICADOR DE CAMA / ESTACIÓN -->
    <div class="form-group">
        <label>Nombre de Cama / Cubículo</label>
        <input type="text" id="numeroCamaInput" placeholder="Ej: Cama 101, Camilla A, Box 3" required>
    </div>

    <!-- 3. CATEGORÍA TÉCNICA -->
    <div class="form-group">
        <label>Tipo de Estación</label>
        <select id="tipoEspacioSelect" required style="margin-bottom: 12px;">
            <option value="CAMA">🛏️ Cama de Hospitalización</option>
            <option value="CAMILLA">🏥 Camilla / Box</option>
            <option value="CONSULTORIO">🩺 Consultorio</option>
            <option value="URGENCIAS">🚨 Cubículo de Urgencias</option>
            <option value="QUIROFANO">😷 Quirófano</option>
        </select>
    </div>

    <!-- 4. NOTAS OPCIONALES -->
    <div class="form-group">
        <label>Notas (Opcional)</label>
        <textarea id="notasInput" rows="2" placeholder="Ubicación específica o detalles..."></textarea>
    </div>

    <button type="submit" class="btn-guardar">
        <i class="fas fa-plus-circle"></i> Guardar Espacio
    </button>
</form>
        </div>

        <!-- LISTADO Y EDICIÓN -->
        <div class="card-panel">
            <h3 style="margin-top: 0; color: #0f172a; font-size: 1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">
                📋 Catálogo de Estaciones Registradas
            </h3>

            <div id="contenedorListaEspacios" class="grid-espacios">
                <p style="color: #94a3b8; font-size: 0.85rem;">Cargando catálogo de espacios...</p>
            </div>
        </div>
    </div>

    <!-- SCRIPTS CORE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/gestion-espacios.js"></script>
</body>
</html>
