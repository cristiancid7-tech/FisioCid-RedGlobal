<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Socios | FisioCid Global</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --fisiocid-orange: #f59e0b; --fisiocid-blue: #2563eb; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-stats { border-radius: 15px; transition: transform 0.2s; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card-stats:hover { transform: translateY(-5px); }
        .badge-plan { font-size: 0.8rem; letter-spacing: 1px; }
        .table-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <button class="btn btn-sm btn-outline-secondary" onclick="solicitarCambioPass()">
    <i class="fas fa-key"></i> Cambiar Contraseña
</button>

<div class="container-fluid p-4">
    <div class="row align-items-center mb-4">
        <div class="col-md-8">
            <h1 id="socioNombre" class="fw-bold text-dark">Cargando...</h1>
            <p class="text-muted"><i class="fas fa-handshake me-2"></i>Panel de Control de Alianzas FisioCid</p>
        </div>
        <div class="col-md-4 text-md-end">
            <span id="badgePlan" class="badge bg-dark p-2 badge-plan text-uppercase">PLAN: --</span>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card card-stats p-3" style="border-left: 5px solid var(--fisiocid-blue) !important;">
                <small class="text-uppercase fw-bold text-muted">Pacientes este mes</small>
                <h2 id="txtPacientesMes" class="fw-bold mt-2">0 / 0</h2>
                <div class="progress mt-2" style="height: 6px;">
                    <div id="barPacientes" class="progress-bar bg-primary" style="width: 0%"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stats p-3" style="border-left: 5px solid #10b981 !important;">
                <small class="text-uppercase fw-bold text-muted">Billetera de Puntos</small>
                <h2 id="txtPuntos" class="fw-bold text-success mt-2">0</h2>
                <small class="text-muted">Valor estimado: <span id="txtEquivalencia">$0.00 MXN</span></small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-stats p-3" style="background: #fffbeb; border: 1px solid #fde68a;">
                <small class="text-uppercase fw-bold text-warning">Tu Link de Referido</small>
                <div class="input-group mt-2">
                    <input type="text" id="linkReferido" class="form-control form-control-sm bg-white" readonly>
                    <button class="btn btn-warning btn-sm" onclick="copiarLink()"><i class="fas fa-copy"></i></button>
                </div>
                <small class="text-muted mt-1" style="font-size: 0.7rem;">Compártelo para ganar puntos</small>
            </div>
        </div>
    </div>

    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0 text-secondary">Seguimiento de Referidos</h5>
            <button class="btn btn-sm btn-outline-primary" onclick="inicializarPortalSocio()"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Paciente</th>
                        <th>Fecha de Cita</th>
                        <th>Estado</th>
                        <th class="text-center">Beneficio</th>
                    </tr>
                </thead>
                <tbody id="tablaReferidos">
                    <tr><td colspan="4" class="text-center py-5"><i class="fas fa-spinner fa-spin me-2"></i>Cargando referidos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase-config.js"></script>

<script src="js/portal-socio.js"></script>
</body>
</html>
