<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCid - Acceso Profesional</title>
    <!-- Google Fonts Inter para aspecto SaaS profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600,700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --secondary: #64748b;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #e0f2fe 100%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #0f172a;
        }

        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .logo-img {
            max-width: 175px;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background: #fff;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        /* Modal y contenedor de Sede */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(15, 23, 42, 0.85);
            z-index: 2000;
            padding: 20px;
        }

        /* 📱 MEDIA QUERIES PARA CELULARES Y TABLETS */
        @media (max-width: 600px) {
            .flex-center {
                padding: 10px;
            }
            .card {
                padding: 25px 18px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="flex-center">
        <div class="card">
            
            <img src="img/logo-fisiocid.png" alt="FisioCid Logo" class="logo-img">
            
            <p style="text-align: center; font-size: 0.75rem; color: var(--secondary); margin-bottom: 1.5rem; font-weight: 600; letter-spacing: 0.5px;">
                SISTEMA DE GESTIÓN CLÍNICA
            </p>

            <!-- Pestañas de Navegación -->
            <div style="display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #e2e8f0; gap: 4px;">
                <button type="button" id="tabDoctor" onclick="switchLoginTab('DOCTOR')" style="flex: 1; background: var(--primary); color: white; border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-user-md"></i> Especialista
                </button>
                <button type="button" id="tabStaff" onclick="switchLoginTab('STAFF')" style="flex: 1; background: transparent; color: var(--secondary); border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-users"></i> Equipo Staff
                </button>
                <button type="button" id="tabPaciente" onclick="switchLoginTab('PACIENTE')" style="flex: 1; background: transparent; color: var(--secondary); border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: 0.2s;">
                    <i class="fas fa-user-injured"></i> Paciente
                </button>
            </div>

            <!-- Formulario Doctor -->
            <form id="loginFormDoctor" onsubmit="procesarLoginDoctor(event)">
                <div class="form-group">
                    <label>CORREO PROFESIONAL</label>
                    <input type="email" id="docEmail" placeholder="medico@fisiocid.com" required>
                </div>
                <div class="form-group">
                    <label>CONTRASEÑA CLÍNICA</label>
                    <input type="password" id="docPass" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrarDoc" style="background: var(--primary); width: 100%; padding: 14px; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); transition: background 0.2s;">ENTRAR AL SISTEMA</button>
            </form>

            <!-- Formulario Staff -->
            <form id="loginFormStaff" onsubmit="procesarLoginStaff(event)" style="display: none;">
                <div class="form-group">
                    <label>CORREO DE COLABORADOR</label>
                    <input type="email" id="staffEmail" placeholder="staff@fisiocid.com" required style="text-transform: lowercase;">
                </div>
                <div class="form-group">
                    <label>CONTRASEÑA ASIGNADA</label>
                    <input type="password" id="staffPass" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrarStaff" style="background: #3b82f6; width: 100%; padding: 14px; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);">INGRESAR COMO EQUIPO</button>
            </form>

            <!-- Formulario Paciente -->
            <form id="loginFormPaciente" onsubmit="procesarLoginPaciente(event)" style="display: none;">
                <div class="form-group">
                    <label>CORREO DE ACCESO</label>
                    <input type="email" id="pacEmail" placeholder="paciente@correo.com" required style="text-transform: lowercase;">
                </div>
                <div class="form-group">
                    <label>CONTRASEÑA TEMPORAL</label>
                    <input type="password" id="pacPass" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnEntrarPac" style="background: #d97706; color: white; width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);">INGRESAR AL PORTAL</button>
            </form>

            <div style="text-align: center; margin-top: 18px;">
                <a href="#" id="olvidePass" style="font-size: 0.8rem; color: var(--primary); text-decoration: none; font-weight: 600;">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

        </div>
    </div>

    <!-- Modal de Selección de Sede -->
    <div id="modalSede" class="modal-overlay" style="display:none;">
        <div class="modal-content card" style="max-width: 420px;">
            <h3 style="color: var(--primary); text-align: center; margin-top: 0;">¡Bienvenido a FisioCid!</h3>
            <p style="text-align: center; color: #64748b; font-size: 0.85rem;">Selecciona la sede donde trabajarás en esta sesión:</p>
            
            <div id="listaSedes" class="form-group" style="margin-top: 15px;"></div>

            <button id="btnConfirmarSede" style="margin-top: 10px; width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                COMENZAR JORNADA
            </button>
        </div>
    </div>

    <!-- Pie de Página -->
    <footer style="width: 100%; text-align: center; padding: 20px 15px; box-sizing: border-box;">
        <hr style="border: 0; border-top: 1px solid #e2e8f0; max-width: 250px; margin: 0 auto 12px auto; opacity: 0.8;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
            <span style="font-size: 0.75rem; color: #64748b; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;">
                <span style="color: var(--primary); font-weight: 800;">FisioCid</span> Red Global © 2026
            </span>
            <small style="font-size: 0.65rem; color: #94a3b8; letter-spacing: 0.3px; max-width: 350px; line-height: 1.3;">
                Infraestructura digital blindada para interoperabilidad clínica.
            </small>
        </div>
    </footer>

    <!-- Scripts Intactos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login-ui.js"></script>
</body>
</html>
