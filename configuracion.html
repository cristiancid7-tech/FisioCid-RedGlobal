<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCid - Seguridad y Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #10B981; --dark-blue: #1E293B; --bg-gray: #F8FAFC; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-gray); color: var(--dark-blue); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 25px; color: var(--dark-blue); font-weight: bold; }
        .section-card { border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px; margin-bottom: 20px; background: #FFFFFF; }
        .section-title { font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; display: inline-block; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; color: #475569; }
        input { padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 1rem; }
        input:disabled { background-color: #F1F5F9; color: #64748B; }
        .btn-custom { background-color: var(--dark-blue); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; width: 100%; }
        .btn-custom:hover { background-color: #0F172A; color: #fff; }
        .btn-primary-custom { background-color: var(--primary-color); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-primary-custom:hover { background-color: #059669; }
        .row-code { display: flex; gap: 10px; margin-top: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">⚙️ SEGURIDAD Y CUENTA</h2>
        <button type="button" onclick="location.href='dashboard.html'" class="btn btn-sm btn-light border fw-bold text-secondary">
            ⬅️ VOLVER
        </button>
    </div>

    <!-- DATOS DE CONTACTO -->
    <div class="section-card">
        <span class="section-title"><i class="bi bi-person-lines-fill"></i> Datos del Perfil</span>
        <form id="formDatosContacto">
            <div class="form-group">
                <label>Nombre Completo (Título)</label>
                <input type="text" id="confNombre" required style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Teléfono de Contacto (Atención a Clientes)</label>
                <input type="tel" id="confTelefono" maxlength="10" pattern="[0-9]{10}" placeholder="10 dígitos" required>
            </div>
            <button type="submit" id="btnPerfil" class="btn-primary-custom">
                <i class="bi bi-save"></i> ACTUALIZAR PERFIL
            </button>
        </form>
    </div>

    <!-- CREDENCIALES AUTH -->
    <div class="section-card">
        <span class="section-title"><i class="bi bi-key-fill"></i> Acceso al Sistema</span>
        <form id="formCredenciales">
            <div class="form-group">
                <label>Correo Electrónico Actual / Nuevo</label>
                <input type="email" id="confEmail" placeholder="correo@ejemplo.com" required style="text-transform: lowercase;">
            </div>
            <div class="form-group">
                <label>Nueva Contraseña (Dejar en blanco si no deseas cambiarla)</label>
                <input type="password" id="confPass" placeholder="Mínimo 6 caracteres (••••••••)">
            </div>
            <button type="submit" id="btnCredenciales" class="btn-custom">
                <i class="bi bi-shield-lock"></i> ACTUALIZAR CREDENCIALES
            </button>
        </form>
    </div>

    <!-- VERIFICACIÓN DE RESPALDO (SMS OTP) -->
    <div class="section-card">
        <span class="section-title"><i class="bi bi-phone-vibrate"></i> Respaldo Telefónico (SMS)</span>
        <p style="font-size: 0.85rem; color: #64748B; margin-top: 0;">
            Vincula un celular de seguridad para recuperar acceso mediante un código enviado por SMS si olvidas tu contraseña o correo.
        </p>
        
        <div class="form-group">
            <label>Número de Respaldo (México - 10 dígitos)</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted fw-bold">+52</span>
                <input type="tel" id="smsTelefono" class="form-control" maxlength="10" pattern="[0-9]{10}" placeholder="2381234567">
            </div>
            <button type="button" id="btnEnviarSMS" class="btn-custom mt-2">
                <i class="bi bi-send-fill"></i> ENVIAR CÓDIGO SMS
            </button>
        </div>

        <div id="bloqueVerificacion" class="form-group hidden">
            <label style="color: var(--primary-color);">Ingresa el código de 6 dígitos recibido</label>
            <div class="row-code">
                <input type="text" id="smsToken" maxlength="6" placeholder="123456" style="flex: 1; text-align: center; letter-spacing: 5px; font-weight: bold;">
                <button type="button" id="btnVerificarCodigo" class="btn-primary-custom" style="width: auto; padding: 10px 20px;">
                    VERIFICAR
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/configuracion-cuenta.js"></script>
</body>
</html>
